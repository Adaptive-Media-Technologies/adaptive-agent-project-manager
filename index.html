<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon">

    <!-- Preconnect + non-blocking font load -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      >
    </noscript>

    <title>Agntive.ai — Task-Driven Workspace for Teams & AI Agents</title>
    <meta name="author" content="Agntive" />
    <meta name="keywords" content="AI team workspace, agentic AI collaboration, task management AI agents, AI project management, team AI automation, replace Slack Notion" />

    <!-- Sitewide Open Graph fallback for non-JS social crawlers on the homepage.
         Per-route Helmet overrides these on inner pages.
         og:url and canonical intentionally set per route (not here) to avoid
         mismatch with inner-page canonicals. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Agntive.ai — Task-Driven Workspace for Teams & AI Agents" />
    <meta property="og:description" content="Unify chat, tasks, notes, and autonomous AI agents in one smart workspace. Replace Slack, Notion, and generic bots." />
    <meta property="og:image" content="https://agntive.ai/favicon.png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@agntive" />
    <meta name="twitter:title" content="Agntive.ai — Task-Driven Workspace for Teams & AI Agents" />
    <meta name="twitter:description" content="Unify chat, tasks, notes, and autonomous AI agents in one smart workspace. Replace Slack, Notion, and generic bots." />
    <meta name="twitter:image" content="https://agntive.ai/favicon.png" />

    <!-- Early per-route canonical + og:url for crawlers that snapshot before React boots.
         Query strings are stripped and trailing slashes normalised (homepage stays "/").
         Helmet later overrides both with the same unique URL. -->
    <script>
      (function () {
        var path = location.pathname.replace(/\/+$/, '') || '/';
        var url = 'https://agntive.ai' + path;
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.setAttribute('data-early-canonical', '');
        link.href = url;
        document.head.appendChild(link);
        var og = document.createElement('meta');
        og.setAttribute('property', 'og:url');
        og.setAttribute('data-early-canonical', '');
        og.setAttribute('content', url);
        document.head.appendChild(og);
      })();
    </script>

  </head>


  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Analytics: kept out of <head> to remove critical-path work. -->
    <script src="https://analytics.ahrefs.com/analytics.js" data-key="QG6n4JnXrQEBaG+n97sPsA" async></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-JQHH4PW1GH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-JQHH4PW1GH', { send_page_view: false });
      gtag('config', 'G-L88JLEPFKT');
    </script>
  </body>
</html>
